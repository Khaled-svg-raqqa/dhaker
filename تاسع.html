<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الثالث الإعدادي</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-blue: #1e40af;
            --primary-blue-hover: #1d4ed8;
            --secondary-green: #059669;
            --secondary-green-hover: #10b981;
            --accent-purple: #7c3aed;
            --accent-purple-hover: #6d28d9;
            --bg-overlay: rgba(15, 23, 42, 0.75);
            --card-bg: rgba(255, 255, 255, 0.85);
            --text-main: #0f172a;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Tajawal', sans-serif;
            min-height: 100vh;
            background-image: linear-gradient(var(--bg-overlay), var(--bg-overlay));
            background-attachment: fixed;
            background-size: cover;
            background-position: center;
            color: var(--text-main);
            padding: 2rem 1rem;
        }

        .header-title {
            text-align: center;
            color: #ffffff;
            font-size: 2.2rem;
            font-weight: 800;
            margin-bottom: 2rem;
            text-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 2rem;
            align-items: start;
        }

        .card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 20px;
            padding: 1.5rem;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.2), 0 8px 10px -6px rgba(0, 0, 0, 0.2);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 25px 30px -5px rgba(0, 0, 0, 0.3);
        }

        .card-header {
            background: linear-gradient(135deg, var(--primary-blue), #3b82f6);
            color: #ffffff;
            font-size: 1.5rem;
            font-weight: 700;
            text-align: center;
            padding: 1rem;
            border-radius: 12px;
            margin-bottom: 1.2rem;
            box-shadow: 0 4px 12px rgba(30, 64, 175, 0.3);
        }

        /* زر الكتاب المترجم الرئيسي */
        .btn-translated {
            display: block;
            background: linear-gradient(135deg, var(--accent-purple), #9333ea);
            color: #ffffff;
            text-decoration: none;
            text-align: center;
            padding: 0.9rem 1rem;
            font-size: 1.2rem;
            font-weight: 700;
            border-radius: 12px;
            margin-bottom: 1.5rem;
            transition: all 0.25s ease;
            box-shadow: 0 4px 12px rgba(124, 58, 237, 0.3);
        }

        .btn-translated:hover {
            background: linear-gradient(135deg, var(--accent-purple-hover), #7e22ce);
            transform: scale(1.02);
            box-shadow: 0 6px 16px rgba(124, 58, 237, 0.4);
        }

        .card-subheader {
            text-align: center;
            font-size: 1.2rem;
            font-weight: 700;
            color: #475569;
            margin-bottom: 1rem;
            position: relative;
            padding-bottom: 0.5rem;
        }

        .card-subheader::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 50px;
            height: 3px;
            background-color: var(--primary-blue);
            border-radius: 2px;
        }

        .units-list {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .unit-link {
            display: block;
            background-color: var(--secondary-green);
            color: #ffffff;
            text-decoration: none;
            text-align: center;
            padding: 0.8rem 1rem;
            font-size: 1.1rem;
            font-weight: 500;
            border-radius: 10px;
            transition: all 0.25s ease;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        .unit-link:hover {
            background-color: var(--secondary-green-hover);
            transform: scale(1.02);
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.4);
        }

        /* تنسيق بطاقة كتاب الأنشطة */
        .activity-book .card-header {
            background: linear-gradient(135deg, #0f766e, #14b8a6);
            box-shadow: 0 4px 12px rgba(15, 118, 110, 0.3);
        }

        .activity-book .card-subheader::after {
            background-color: #0f766e;
        }

        @media (max-width: 640px) {
            body {
                padding: 1rem 0.5rem;
            }
            .header-title {
                font-size: 1.75rem;
            }
            .card {
                padding: 1rem;
            }
            .btn-translated {
                font-size: 1.05rem;
                padding: 0.75rem;
            }
            .unit-link {
                font-size: 1rem;
                padding: 0.7rem;
            }
        }
    </style>
</head>
<body>

    <h1 class="header-title">الثالث الإعدادي</h1>

    <div class="container">
        
        <!-- كتاب الطالب -->
        <div class="card student-book">
            <div class="card-header">كتاب الطالب</div>
            
            <a href="كتاب مترجم1.html" class="btn-translated">الكتاب المترجم</a>

            <div class="card-subheader">الامتحانات</div>
            
            <div class="units-list">
                <a href="#" class="unit-link">الوحدة الأولى</a>
                <a href="#" class="unit-link">الوحدة الثانية</a>
                <a href="#" class="unit-link">الوحدة الثالثة</a>
                <a href="#" class="unit-link">الوحدة الرابعة</a>
                <a href="#" class="unit-link">الوحدة الخامسة</a>
                <a href="#" class="unit-link">الوحدة السادسة</a>
                <a href="#" class="unit-link">الوحدة السابعة</a>
                <a href="#" class="unit-link">الوحدة الثامنة</a>
                <a href="#" class="unit-link">الوحدة التاسعة</a>
                <a href="#" class="unit-link">الوحدة العاشرة</a>
                <a href="#" class="unit-link">الوحدة الحادية عشر</a>
                <a href="#" class="unit-link">الوحدة الثانية عشر</a>
            </div>
        </div>

        <!-- كتاب الأنشطة -->
        <div class="card activity-book">
            <div class="card-header">كتاب الأنشطة</div>
            
            <a href="انشطة.html" class="btn-translated">الكتاب المترجم</a>
        </div>

    </div>

</body>
</html>
