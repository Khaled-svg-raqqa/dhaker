<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>كتاب الطالب المترجم</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-blue: #1e40af;
            --secondary-green: #059669;
            --secondary-green-hover: #10b981;
            --bg-overlay: rgba(15, 23, 42, 0.75);
            --card-bg: rgba(255, 255, 255, 0.85);
            --text-main: #0f172a;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Tajawal', sans-serif;
            min-height: 100vh;
            background-image: linear-gradient(var(--bg-overlay), var(--bg-overlay));
            background-attachment: fixed;
            background-size: cover;
            background-position: center;
            color: var(--text-main);
            padding: 2rem 1rem;
        }

        .header-title {
            text-align: center;
            color: #ffffff;
            font-size: 2.2rem;
            font-weight: 800;
            margin-bottom: 2rem;
            text-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
        }

        .container {
            max-width: 650px;
            margin: 0 auto;
        }

        .card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 20px;
            padding: 1.5rem;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.2), 0 8px 10px -6px rgba(0, 0, 0, 0.2);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 25px 30px -5px rgba(0, 0, 0, 0.3);
        }

        .card-header {
            background: linear-gradient(135deg, var(--primary-blue), #3b82f6);
            color: #ffffff;
            font-size: 1.5rem;
            font-weight: 700;
            text-align: center;
            padding: 1rem;
            border-radius: 12px;
            margin-bottom: 1.2rem;
            box-shadow: 0 4px 12px rgba(30, 64, 175, 0.3);
        }

        .card-subheader {
            text-align: center;
            font-size: 1.2rem;
            font-weight: 700;
            color: #475569;
            margin-bottom: 1rem;
            position: relative;
            padding-bottom: 0.5rem;
        }

        .card-subheader::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 50px;
            height: 3px;
            background-color: var(--primary-blue);
            border-radius: 2px;
        }

        .units-list {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .unit-link {
            display: block;
            background-color: var(--secondary-green);
            color: #ffffff;
            text-decoration: none;
            text-align: center;
            padding: 0.8rem 1rem;
            font-size: 1.1rem;
            font-weight: 500;
            border-radius: 10px;
            transition: all 0.25s ease;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        .unit-link:hover {
            background-color: var(--secondary-green-hover);
            transform: scale(1.02);
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.4);
        }

        @media (max-width: 640px) {
            body {
                padding: 1rem 0.5rem;
            }
            .header-title {
                font-size: 1.75rem;
            }
            .card {
                padding: 1rem;
            }
            .unit-link {
                font-size: 1rem;
                padding: 0.7rem;
            }
        }
    </style>
</head>
<body>

    <h1 class="header-title">كتاب الطالب المترجم</h1>

    <div class="container">
        <div class="card student-book">
            <div class="card-header">كتاب الطالب المترجم</div>
            <div class="card-subheader">الوحدات الدراسية</div>
            
            <div class="units-list">
                <a href="https://drive.google.com/file/d/1_WIeA8VPABXW1mwSbzU1OtCyBphZMQhj/view?usp=sharing" target="_blank" class="unit-link">الوحدة الأولى</a>
                <a href="https://drive.google.com/file/d/1HJZYe36bAU85j0enTaYQtYm9IlE7TjRB/view?usp=sharing" target="_blank" class="unit-link">الوحدة الثانية</a>
                <a href="https://drive.google.com/file/d/1hwnw18k_LUXsVtr0BMmfsx4TMuU-xVD0/view?usp=sharing" target="_blank" class="unit-link">الوحدة الثالثة</a>
                <a href="https://drive.google.com/file/d/1rmdL4_o8dQWiQz83_pdbOIJPO_A9CAFo/view?usp=sharing" target="_blank" class="unit-link">الوحدة الرابعة</a>
                <a href="https://drive.google.com/file/d/1Q_RZRMSViZJwl0B6_j7wN4TO9Xn9kRrT/view?usp=sharing" target="_blank" class="unit-link">الوحدة الخامسة</a>
                <a href="https://drive.google.com/file/d/1VAxv_fbRihvfcRKvUjUpsSO-RK2FHi3M/view?usp=sharing" target="_blank" class="unit-link">الوحدة السادسة</a>
                <a href="https://drive.google.com/file/d/1WjsA9L2VVRkx3YckGS3PGcPqzZ9OD3WJ/view?usp=sharing" target="_blank" class="unit-link">الوحدة السابعة</a>
                <a href="https://drive.google.com/file/d/1RvKUWkzV5lQVDudZTIP1QPE-pG8QmSwV/view?usp=sharing" target="_blank" class="unit-link">الوحدة الثامنة</a>
                <a href="https://drive.google.com/file/d/1UY69BO-v4suDrtMl_8y1gPOidCIb0m2l/view?usp=sharing" target="_blank" class="unit-link">الوحدة التاسعة</a>
                <a href="https://drive.google.com/file/d/1QDsmvV9zXmBsV4ZVw7x_WVnzt0ImByCQ/view?usp=sharing" target="_blank" class="unit-link">الوحدة العاشرة</a>
                <a href="https://drive.google.com/file/d/1pTmSztDbqC0yGicUB7ZmM9e4yPPKh3DF/view?usp=sharing" target="_blank" class="unit-link">الوحدة الحادية عشر</a>
                <a href="https://drive.google.com/file/d/19W2jJtOBGLn2fgZ5TIgAjyOmdNsm72EA/view?usp=sharing" target="_blank" class="unit-link">الوحدة الثانية عشر</a>
            </div>
        </div>
    </div>

</body>
</html>
